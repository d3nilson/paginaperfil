    <main>
        <section>
            <fieldset >
                <legend>Preenchar o Formulário Para Entrar em contato</legend>
                    <form action="/cadastro" method="post">
                        <div class="cadastro">
                            <label for="nome">Nome:</label>
                            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" maxlength="50"required>
                        </div><br>
                        <div class="cadastro">
                            <label for="email">E-mail</label>
                            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" maxlength="150"required>
                        </div><br>
                        <div>
                            <label for="assunto">Assunto</label>
                            <input type="text" id="assunto" name="assunto" placeholder="Digite o assunto" maxlength="20" required>
                        </div><br>
                        <div class="cadastro">
                            <label for="mensagem">Mensagem:</label>
                            <textarea id="mensagem" name="mensagem" rows="5" cols="30" maxlength="300"required></textarea>
                        </div><br>
                        <div class="cadastro">
                            <button type="reset">Limpar</button>
                            <button type="submit">Enviar </button>
                        </div>
                    </form>
            </fieldset>
        </section>
